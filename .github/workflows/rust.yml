name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust Nightly
        uses: actions-rs/toolchain@v1
        with:
            toolchain: nightly-2026-07-20
            override: true
            components: rustfmt, clippy
      - name: Check
        run: cargo check --manifest-path projects/mysql.rs/Cargo.toml --workspace --all-targets
      - name: Tests
        run: cargo test --manifest-path projects/mysql.rs/Cargo.toml --workspace
