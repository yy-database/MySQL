name: Check Rust

# Rust workspace fmt / build / test. TypeScript: check-typescript.yml
# Python: check-python.yml. Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: rustc --version && cargo --version
      - name: Format check
        run: cargo fmt --manifest-path projects/mysql.rs/Cargo.toml --all --check

  rust-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/mysql.rs
      - name: Build
        run: cargo build --release --manifest-path projects/mysql.rs/Cargo.toml --workspace --exclude mysql-napi --exclude mysql-pyo3
      - name: Tests
        run: cargo test --release --manifest-path projects/mysql.rs/Cargo.toml --workspace --exclude mysql-napi --exclude mysql-pyo3

  rust-wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/mysql.rs
      - name: Build the wasm codec
        run: cargo build --manifest-path projects/mysql.rs/Cargo.toml -p mysql-wasm --target wasm32-unknown-unknown
  toolchain-health:
    name: toolchain health
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustup show active-toolchain && rustc -vV
