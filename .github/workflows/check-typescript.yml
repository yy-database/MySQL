name: Check TypeScript

# pnpm install, TypeScript build, native binding smoke and install-state
# acceptance (packs the product, platform package and harness, installs them in
# a temporary directory and connects with the real mysql2 driver).
# Python: check-python.yml. Rust workspace: check-rust.yml.
# Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

jobs:
  typescript:
    name: pnpm packages
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/mysql.rs
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build TypeScript
        run: pnpm run build:ts
      - name: Build the native binding
        run: node scripts/build-napi.mjs
      - name: Smoke the native roundtrip
        run: node projects/mysql.ts/examples/roundtrip.ts
      - name: Install-state acceptance
        run: node projects/mysql.ts/packages/mysql-harness/stages/install.mjs
      - name: Build the WebAssembly package
        run: pnpm run build:wasm
      - name: Check the WebAssembly package
        run: pnpm run check:wasm
      - name: Typecheck the workspace
        run: pnpm run typecheck
