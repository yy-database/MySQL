name: Check Python

# Wheel build plus install-state acceptance: the harness builds the wheel, puts
# it in a clean virtualenv in a system temporary directory, installs the real
# `pymysql` driver and runs every declarative case from inside the virtualenv.
# TypeScript: check-typescript.yml. Rust workspace: check-rust.yml.
# Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: mysql-pyo3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/mysql.rs
      - name: Install the wheel build tool
        run: python -m pip install --quiet "maturin>=1.7,<2.0"
      - name: Install-state acceptance
        run: node projects/mysql.ts/packages/mysql-harness/stages/python.mjs
