[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "yydb-mysql"
version = "0.0.0"
description = "MySQL classic-protocol primitives assembled from the Rust mysql-pyo3 bindings"
license = { text = "MPL-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
manifest-path = "../../../mysql.rs/mysql-pyo3/Cargo.toml"
python-source = "."
module-name = "mysql.mysql_pyo3"
