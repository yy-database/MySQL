[package]
name = "mysql-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser WebAssembly binding for the MySQL classic-protocol primitives"
readme = "readme.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mysql-core = { path = "../mysql-core" }
wasm-bindgen = { workspace = true }

# `getrandom` 0.4 has no default backend for `wasm32-unknown-unknown`. The
# feature unifies with the copy pulled in through `mysql-core`, so the shared
# dependency graph links instead of failing with the crate's compile_error.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
