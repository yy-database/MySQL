[workspace]
resolver = "2"
members = [
    "mysql-napi",
    "mysql-pyo3",
    "mysql-wasm",
]
default-members = ["mysql-napi", "mysql-pyo3", "mysql-wasm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/MySQL"

[workspace.dependencies]
# `database-protocol-mysql` is the shared classic-protocol codec that lives
# upstream in database.rs. Pin the full 40-character revision and keep every
# database.rs dependency on the same revision, otherwise `database-types` is
# compiled twice from two sources and one dependency silently drifts.
# Local path overrides belong in `.cargo/config.toml`, see `.cargo/config.example.toml`.
database-protocol-mysql = { git = "https://github.com/oovm/database.rs.git", rev = "6913c5e485950616bfb45fa48fcaf2870bb7537d" }
# The `database` facade exposes the upstream MySQL gateway, `.yyds` catalog,
# `.yykv` shard, KV executor and persisted SQL schema registry. It is pinned to
# the same revision as `database-protocol-mysql` so `database-types` is compiled
# once, from one source.
database = { git = "https://github.com/oovm/database.rs.git", rev = "6913c5e485950616bfb45fa48fcaf2870bb7537d", package = "database", default-features = false }

napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
