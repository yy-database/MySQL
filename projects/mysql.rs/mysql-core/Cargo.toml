[package]
name = "mysql-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MySQL classic-protocol primitives shared by the Node-API, PyO3 and WASM bindings"
readme = "readme.md"
publish = false

[lib]
name = "mysql_core"
crate-type = ["rlib"]

[dependencies]
database-protocol-mysql = { workspace = true }
database = { workspace = true, optional = true, features = ["types", "query", "execution", "storage", "cluster", "server"] }

[features]
default = []
# Node-directory composition and the upstream MySQL listener. Enabled by the
# Node-API and PyO3 bindings; never by the WebAssembly binding, which has no
# socket loop or thread support.
server = ["dep:database"]
