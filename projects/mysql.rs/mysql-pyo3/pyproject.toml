[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mysql-pyo3"
version = "0.0.0"
description = "PyO3 bindings for the MySQL classic-protocol primitives"
license = { text = "MPL-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "mysql_pyo3"
