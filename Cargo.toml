[workspace]
resolver = "3"
members = [
    "packages/yykv-types",
    "packages/yykv",
    "packages/yykv-profile",
    "packages/yykv-bench",
    "packages/yykv-udf",
    "packages/yykv-scheduler",
    "packages/yykv-tiering",
    "packages/yykv-hal",
    "packages/yykv-compaction",
    "packages/yykv-layout",
    "packages/yykv-allocator",
    "packages/yykv-io",
    "packages/yykv-policy",
    "packages/yykv-compute",
    "packages/yykv-stream",
    "packages/yykv-wal",
    "packages/yykv-operators",
    "packages/yykv-executor",
    "packages/yykv-schema",
    "packages/yykv-event",
    "packages/yykv-index",
    "packages/yykv-storage",
    "protocols/we-trust",
    "protocols/we-trust-arrow",
    "protocols/we-trust-d1",
    "protocols/we-trust-mysql",
    "protocols/we-trust-otel",
    "protocols/we-trust-postgres",
    "protocols/we-trust-redis",
    "protocols/we-trust-s3",
    "protocols/we-trust-sqlite",
    "protocols/we-trust-sqlserver",
    "protocols/we-trust-vector"
]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["YY Team"]
license = "MPL-2.0"
repository = "https://github.com/yydb/yykv"
homepage = "https://yydb.io"


[workspace.dependencies]
# Main Package
yykv = { path = "packages/yykv", version = "0.0.0" }

# Workspace Internal Packages
yykv-types = { path = "packages/yykv-types", version = "0.0.0" }
yykv-hal = { path = "packages/yykv-hal", version = "0.0.0" }
yykv-allocator = { path = "packages/yykv-allocator", version = "0.0.0" }
yykv-io = { path = "packages/yykv-io", version = "0.0.0" }
yykv-layout = { path = "packages/yykv-layout", version = "0.0.0" }
yykv-compaction = { path = "packages/yykv-compaction", version = "0.0.0" }
yykv-scheduler = { path = "packages/yykv-scheduler", version = "0.0.0" }
yykv-tiering = { path = "packages/yykv-tiering", version = "0.0.0" }
yykv-policy = { path = "packages/yykv-policy", version = "0.0.0" }
yykv-udf = { path = "packages/yykv-udf", version = "0.0.0" }
yykv-compute = { path = "packages/yykv-compute", version = "0.0.0" }
yykv-stream = { path = "packages/yykv-stream", version = "0.0.0" }
yykv-wal = { path = "packages/yykv-wal", version = "0.0.0" }
yykv-operators = { path = "packages/yykv-operators", version = "0.0.0" }
yykv-executor = { path = "packages/yykv-executor", version = "0.0.0" }
yykv-index = { path = "packages/yykv-index", version = "0.0.0" }
yykv-schema = { path = "packages/yykv-schema", version = "0.0.0" }
yykv-event = { path = "packages/yykv-event", version = "0.0.0" }
yykv-storage = { path = "packages/yykv-storage", version = "0.0.0" }

# Protocols
we-trust = { path = "protocols/we-trust", version = "0.0.0" }
we-trust-arrow = { path = "protocols/we-trust-arrow", version = "0.0.0" }
we-trust-d1 = { path = "protocols/we-trust-d1", version = "0.0.0" }
we-trust-mysql = { path = "protocols/we-trust-mysql", version = "0.0.0" }
we-trust-otel = { path = "protocols/we-trust-otel", version = "0.0.0" }
we-trust-postgres = { path = "protocols/we-trust-postgres", version = "0.0.0" }
we-trust-redis = { path = "protocols/we-trust-redis", version = "0.0.0" }
we-trust-s3 = { path = "protocols/we-trust-s3", version = "0.0.0" }
we-trust-sqlite = { path = "protocols/we-trust-sqlite", version = "0.0.0" }
we-trust-sqlserver = { path = "protocols/we-trust-sqlserver", version = "0.0.0" }
we-trust-vector = { path = "protocols/we-trust-vector", version = "0.0.0" }

# External projects for Local
oak-sql = { path = "../oaks/examples/oak-sql" }
oak-json = { path = "../oaks/examples/oak-json" }
oak-toml = { path = "../oaks/examples/oak-toml" }
oak-core = { path = "../oaks/projects/oak-core" }
oak-xml = { path = "../oaks/examples/oak-xml" }

# External projects for CI
# oak-sql = "0.0.3"
# oak-json = "0.0.3"
# oak-core = "0.0.3"
# oak-toml = "0.0.3"
# oak-xml = "0.0.3"

# External Dependencies
bytes = { version = "1.11.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
crc32fast = "1.5.0"
futures = "0.3.31"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-stream = "0.1.18"
clap = { version = "4.5.58", features = ["derive"] }
indicatif = "0.18.3"
console = "0.16.2"
rand = "0.10.0"
async-trait = "0.1.89"
uuid = { version = "1.20.0", features = ["v4", "v7", "serde"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
sha2 = "0.10.9"
chrono = { version = "0.4.43", features = ["serde"] }
parking_lot = { version = "0.12.5" }
byteorder = "1.5.0"
http = "1.4.0"
hmac = "0.12.1"
hex = "0.4.3"
lru = "0.16.3"
tempfile = { version = "3.25.0" }
rust_decimal = "1.40.0"
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security"] }
libc = "0.2.182"
criterion = "0.8.2"
simd-json = "0.17.0"
wasmtime = { version = "41.0.3", default-features = false, features = ["component-model", "async", "cranelift", "runtime"] }
wasmtime-wasi = "41.0.3"
wit-bindgen = "0.53.0"
md5 = "0.8.0"

# Benchmark Dependencies
resp = "1.0.3"
