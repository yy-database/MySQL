[workspace]
resolver = "3"
members = [
    "backends/distributed/*",
    "backends/kv-store/*",
    "backends/protocols/*",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["YY Team"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/yyds"
homepage = "https://github.com/yy-database/yyds"


[workspace.dependencies]
bytes = { version = "1.11.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
crc32fast = "1.5.0"
futures = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-stream = "0.1.18"
clap = { version = "4.5.59", features = ["derive"] }
indicatif = "0.18.4"
console = "0.16.2"
rand = "0.10.0"
async-trait = "0.1.89"
uuid = { version = "1.21.0", features = ["v4", "v7", "serde"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
sha2 = "0.10.9"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = { version = "0.12.5" }
byteorder = "1.5.0"
http = "1.4.0"
hmac = "0.12.1"
hex = "0.4.3"
lru = "0.16.3"
tempfile = { version = "3.25.0" }
rust_decimal = "1.40.0"
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security"] }
libc = "0.2.182"
criterion = "0.8.2"
simd-json = "0.17.0"
wasmtime = { version = "41.0.3", default-features = false, features = ["component-model", "async", "cranelift", "runtime"] }
wasmtime-wasi = "41.0.3"
wit-bindgen = "0.53.1"
md5 = "0.8.0"
resp = "1.0.3"
serde_json = "1.0.149"
arrow = { version = "57.3", features = ["ipc"] }
arrow-flight = "57.3.0"
tonic = { version = "0.14.4", features = ["codegen", "prost"] }
prost = "0.14.3"
odbc-sys = "0.28.0"
mio = { version = "1.1.1", features = ["net", "os-poll"] }
prometheus = { version = "0.14.0", features = ["process"] }
tracing-opentelemetry = "0.32.1"
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = "0.31.0"
thiserror = "2.0.18"
# Pure Rust SQLite implementation
limbo = "0.0.22"
# Async utilities
async-stream = "0.3.0"
dialoguer = "0.12.0"


# Protocols
we-trust = { path = "backends/protocols/we-trust", version = "0.0.0" }
we-trust-arrow = { path = "backends/protocols/we-trust-arrow", version = "0.0.0" }
we-trust-d1 = { path = "backends/protocols/we-trust-d1", version = "0.0.0" }
we-trust-mysql = { path = "backends/protocols/we-trust-mysql", version = "0.0.0" }
we-trust-otel = { path = "backends/protocols/we-trust-otel", version = "0.0.0" }
we-trust-postgres = { path = "backends/protocols/we-trust-postgres", version = "0.0.0" }
we-trust-redis = { path = "backends/protocols/we-trust-redis", version = "0.0.0" }
we-trust-s3 = { path = "backends/protocols/we-trust-s3", version = "0.0.0" }
we-trust-sqlite = { path = "backends/protocols/we-trust-sqlite", version = "0.0.0" }
we-trust-sqlserver = { path = "backends/protocols/we-trust-sqlserver", version = "0.0.0" }
we-trust-vector = { path = "backends/protocols/we-trust-vector", version = "0.0.0" }

# YYKV Packages
yykv = { path = "backends/kv-store/yykv", version = "0.0.0" }
yykv-odbc = { path = "backends/kv-store/yykv-odbc", version = "0.0.0" }
yykv-server = { path = "backends/kv-store/yykv-server", version = "0.0.0" }
yykv-types = { path = "backends/kv-store/yykv-types", version = "0.0.0" }
yykv-hal = { path = "backends/kv-store/yykv-hal", version = "0.0.0" }
yykv-allocator = { path = "backends/kv-store/yykv-allocator", version = "0.0.0" }
yykv-io = { path = "backends/kv-store/yykv-io", version = "0.0.0" }
yykv-layout = { path = "backends/kv-store/yykv-layout", version = "0.0.0" }
yykv-compaction = { path = "backends/kv-store/yykv-compaction", version = "0.0.0" }
yykv-scheduler = { path = "backends/kv-store/yykv-scheduler", version = "0.0.0" }
yykv-tiering = { path = "backends/kv-store/yykv-tiering", version = "0.0.0" }
yykv-policy = { path = "backends/kv-store/yykv-policy", version = "0.0.0" }
yykv-udf = { path = "backends/kv-store/yykv-udf", version = "0.0.0" }
yykv-compute = { path = "backends/kv-store/yykv-compute", version = "0.0.0" }
yykv-stream = { path = "backends/kv-store/yykv-stream", version = "0.0.0" }
yykv-operators = { path = "backends/kv-store/yykv-operators", version = "0.0.0" }
yykv-executor = { path = "backends/kv-store/yykv-executor", version = "0.0.0" }
yykv-index = { path = "backends/kv-store/yykv-index", version = "0.0.0" }
yykv-schema = { path = "backends/kv-store/yykv-schema", version = "0.0.0" }
yykv-wal = { path = "backends/kv-store/yykv-wal", version = "0.0.0" }
yykv-event = { path = "backends/kv-store/yykv-event", version = "0.0.0" }
yykv-storage = { path = "backends/kv-store/yykv-storage", version = "0.0.0" }

# YYDS Packages
yyds = { path = "backends/distributed/yyds", version = "0.0.0" }
yyds-odbc = { path = "backends/distributed/yyds-odbc", version = "0.0.0" }
yyds-types = { path = "backends/distributed/yyds-types", version = "0.0.0" }
yyds-ai = { path = "backends/distributed/yyds-ai", version = "0.0.0" }
yyds-billing = { path = "backends/distributed/yyds-billing", version = "0.0.0" }
yyds-cache = { path = "backends/distributed/yyds-cache", version = "0.0.0" }
yyds-compute = { path = "backends/distributed/yyds-compute", version = "0.0.0" }
yyds-consensus = { path = "backends/distributed/yyds-consensus", version = "0.0.0" }
yyds-gateway = { path = "backends/distributed/yyds-gateway", version = "0.0.0" }
yyds-observability = { path = "backends/distributed/yyds-observability", version = "0.0.0" }
yyds-pubsub = { path = "backends/distributed/yyds-pubsub", version = "0.0.0" }
yyds-quota = { path = "backends/distributed/yyds-quota", version = "0.0.0" }
yyds-server = { path = "backends/distributed/yyds-server", version = "0.0.0" }
yyds-task = { path = "backends/distributed/yyds-task", version = "0.0.0" }
yyds-tenant = { path = "backends/distributed/yyds-tenant", version = "0.0.0" }
yyds-loader = { path = "backends/distributed/yyds-loader", version = "0.0.0" }
yyds-tools = { path = "backends/distributed/yyds-tools", version = "0.0.0" }

# Oak parsers
oak-core = { version = "0.0.8", git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-sql = { version = "0.0.8", git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-rbq = { version = "0.0.8", git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-json = { version = "0.0.8", git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-toml = { version = "0.0.8", git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-xml = { version = "0.0.8", git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-dsv = { version = "0.0.8", git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }

