[package]
name = "yyds-consensus"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Distributed consensus implementation for YYDS based on Raft or Paxos"
readme = "readme.md"

[dependencies]
yyds-types = { workspace = true }
yykv-event = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.89"
uuid = { version = "1.21.0", features = ["v4", "v7", "serde"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
