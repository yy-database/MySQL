[package]
name = "yyds-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "yyds"
path = "src/bin/yyds.rs"

[[bin]]
name = "yykv"
path = "src/bin/yykv.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
yyds = { workspace = true }
yyds-types = { workspace = true }
yyds-loader = { workspace = true }
yyds-server = { workspace = true }
yykv = { workspace = true }
yykv-server = { workspace = true }
yykv-types = { workspace = true }
yykv-hal = { workspace = true }
yykv-io = { workspace = true }
yykv-layout = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
dialoguer = { workspace = true }
uuid = { workspace = true }
